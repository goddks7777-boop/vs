name: 코인 일봉 스윙 학습·검증

on:
  schedule:
    # 업비트 일봉(09:00 KST)이 완성된 뒤 실행
    - cron: "25 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-data-writer
  cancel-in-progress: false

jobs:
  learn-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 일봉 학습·시간순 검증
        run: |
          python automation/btc_cycle_analysis.py
          python automation/swing_learning.py --max-markets 80 --days 420
          python automation/multi_timeframe_swing.py --training-markets 50 --bars 800
      - name: 결과 안전성 검증
        run: |
          python automation/validate_swing_learning.py
          python automation/validate_btc_cycle.py
          python automation/validate_multi_timeframe.py
          python automation/inject_swing_nav.py
      - name: 연구 결과 저장
        run: |
          git config user.name "swing-research-bot"
          git config user.email "swing-research-bot@users.noreply.github.com"
          git add monitor_data/swing_learning.json monitor_data/btc_cycle_analysis.json monitor_data/multi_timeframe_swing.json 업비트_1시간_모니터링.html 업비트_원화마켓_시각화_보고서_2026-08-11.html 업비트_지표_백과.html 코인_1주일_가상투자.html 코인_AI스윙_학습검증.html 코인_싸이클_분석.html 코인_유동.html 업비트_분석_홈.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "일봉 스윙 학습·검증 갱신"
            git pull --rebase origin main
            git push
          fi
