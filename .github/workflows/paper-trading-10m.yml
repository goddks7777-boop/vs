name: 10분 모의투자 점검

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-10m
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v5

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 국내주식 현재가 모듈 설치
        run: pip install --disable-pip-version-check yfinance

      - name: KOSPI·KOSDAQ 시가총액 갱신
        run: python automation/refresh_stock_market_caps.py

      - name: KOSPI·KOSDAQ 전체 기술지표 계산·실패 재시도
        run: python automation/refresh_stock_full_metrics.py

      - name: 완성된 최신 1시간봉 지표 갱신
        run: python automation/refresh_coin_hourly.py

      - name: 10분 모의 매수·매도 판단
        run: python automation/paper_10m.py

      - name: 웹 화면 실시간 JSON 연결 확인
        run: |
          python automation/inject_live_ui.py
          python automation/inject_stock_market_cap.py

      - name: 상태와 가상투자 기록 저장
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add monitor_data/*.json stock_data/*.json automation/status_10m.json 코인_1주일_가상투자.html 주식_종합분석.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "10분 모의투자 자동 갱신"
            git push
          fi


