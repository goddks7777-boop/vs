
name: 주식 10분 모의투자 점검

on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-trading-10m.yml"
      - "automation/paper_10m.py"
      - "automation/refresh_stock_market_caps.py"
      - "automation/refresh_stock_full_metrics.py"
      - "automation/stock-paper-live.js"
      - "automation/inject_stock_paper_ui.py"
      - "automation/validate_paper_system.py"

permissions:
  contents: write

concurrency:
  group: paper-data-writer
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v5

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: KOSPI·KOSDAQ 시가총액 갱신
        run: python automation/refresh_stock_market_caps.py

      - name: KOSPI·KOSDAQ 전체 기술지표 계산·실패 재시도
        run: python automation/refresh_stock_full_metrics.py

      - name: 주식 10분 모의 매수·매도 판단
        run: python automation/paper_10m.py --market stock

      - name: 웹 화면 실시간 JSON 연결 확인
        run: |
          python automation/inject_stock_market_cap.py
          python automation/inject_paper_summary.py
          python automation/inject_stock_paper_ui.py
          python automation/validate_paper_system.py --market stock

      - name: 상태와 가상투자 기록 저장
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add stock_data/*.json automation/status_10m.json 주식_종합분석.html 주식_1주일_모의투자.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "10분 모의투자 자동 갱신"
            git pull --rebase origin main
            git push
          fi




