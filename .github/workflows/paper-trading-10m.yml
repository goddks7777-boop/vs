name: 10분 모의투자 점검

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-10m
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 국내주식 현재가 모듈 설치
        run: pip install --disable-pip-version-check yfinance

      - name: 10분 모의 매수·매도 판단
        run: python automation/paper_10m.py

      - name: 상태와 가상투자 기록 저장
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add monitor_data/paper_week.json stock_data/paper_week_krx.json automation/status_10m.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "10분 모의투자 자동 갱신"
            git push
          fi

